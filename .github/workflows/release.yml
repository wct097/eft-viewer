name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EftViewer.sln

      - name: Build
        run: dotnet build EftViewer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/EftViewer.Core.Tests/EftViewer.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/EftViewer.Desktop/EftViewer.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish

      - name: Package
        shell: bash
        run: |
          archive="EftViewer-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ( cd publish && 7z a "../$archive" ./* )
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Wrap the published binary in a proper .app bundle so Finder can
            # launch it by double-click. A bare Mach-O executable triggers the
            # "choose an application" prompt and cannot be opened from Finder.
            version="${{ github.ref_name }}"
            version="${version#v}"
            app="EftViewer.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R publish/. "$app/Contents/MacOS/"
            chmod +x "$app/Contents/MacOS/EftViewer.Desktop"
            sed "s/@VERSION@/${version}/g" .github/macos/Info.plist > "$app/Contents/Info.plist"
            # ditto preserves bundle structure/symlinks/resource forks; plain zip can mangle .app bundles.
            ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          else
            ( cd publish && zip -r "../$archive" ./* )
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EftViewer-${{ matrix.rid }}
          path: EftViewer-${{ github.ref_name }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
